<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420">
  <defs>
    <radialGradient id="g1" cx="18%" cy="20%" r="60%"><stop offset="0" stop-color="#7c3aed" stop-opacity=".55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="85%" cy="90%" r="55%"><stop offset="0" stop-color="#ec4899" stop-opacity=".45"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#f472b6"/><stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1280" height="420" rx="28" fill="#09090d"/>
  <rect width="1280" height="420" rx="28" fill="url(#g1)"/>
  <rect width="1280" height="420" rx="28" fill="url(#g2)"/>
  <!-- edge light -->
  <rect x="3" y="3" width="1274" height="414" rx="26" fill="none" stroke="url(#rim)" stroke-width="3" opacity=".9"/>
  <rect x="3" y="3" width="1274" height="414" rx="26" fill="none" stroke="url(#rim)" stroke-width="8" opacity=".45" filter="url(#blur)"/>
  <!-- eyebrow -->
  <text x="640" y="92" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="15" letter-spacing="6" fill="#a1a1aa">LYRICS FOR YOUR LOCK SCREEN</text>
  <!-- wordmark -->
  <text x="640" y="205" text-anchor="middle" font-family="-apple-system,'SF Pro Display',Helvetica,Arial,sans-serif" font-size="128" font-weight="800" letter-spacing="-4" fill="#fff">Cadence</text>
  <!-- lyric line with highlighter box on the sung word -->
  <rect x="587" y="266" width="112" height="48" rx="8" fill="#facc15"/>
  <text x="643" y="302" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="38" font-weight="800" fill="#09090d">word</text>
  <text x="528" y="302" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="38" font-weight="700" fill="#e4e4e7">sing it</text>
  <text x="768" y="302" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="38" font-weight="700" fill="#52525b">by word</text>
  <!-- footer line -->
  <text x="640" y="372" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="16" letter-spacing="2" fill="#71717a">SPOTIFY · APPLE MUSIC · YOUTUBE   ·   macOS 14+   ·   FREE &amp; OPEN SOURCE</text>
</svg>
